{% extends "base.html" %}

{% block title %}Create Account — BRAINBUXX{% endblock %}

{% block content %}

<section class="auth-wrapper">

    <div class="auth-card">

        <div class="brand-icon large">B</div>

        <h1>Join Brainbuxx</h1>

        <p class="muted">
            Your ideas deserve room to grow.
        </p>

        <form method="POST" class="auth-form">

            <label for="username">Username</label>

            <input
                id="username"
                name="username"
                type="text"
                minlength="3"
                maxlength="30"
                autocomplete="username"
                required
            >

            <label for="email">Email address</label>

            <input
                id="email"
                name="email"
                type="email"
                maxlength="254"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button class="button primary full-width" type="submit">
                Create Account
            </button>

        </form>

        <p class="auth-switch">
            Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

    </div>

</section>

{% endblock %}
